<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PlayComun - ¿Qué necesita tu negocio?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Sora:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0d15;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0d15;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30.0"
      data-width="1080"
      data-height="1920"
    >
      <!-- ── ESCENAS / SUB-COMPOSICIONES ── -->
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-web"
        class="scene"
        data-composition-id="02-web"
        data-composition-src="compositions/frames/02-web.html"
        data-start="5.3"
        data-duration="6.7"
        data-track-index="1"
      ></div>

      <div
        id="el-03-webapp"
        class="scene"
        data-composition-id="03-webapp"
        data-composition-src="compositions/frames/03-webapp.html"
        data-start="11.8"
        data-duration="6.7"
        data-track-index="0"
      ></div>

      <div
        id="el-04-saas"
        class="scene"
        data-composition-id="04-saas"
        data-composition-src="compositions/frames/04-saas.html"
        data-start="18.3"
        data-duration="6.2"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="24.3"
        data-duration="5.7"
        data-track-index="0"
      ></div>

      <!-- ── AUDIO BGM (Beat dinámico) ── -->
      <audio
        id="bgm"
        class="clip"
        src="assets/audio/bgm-beat-31s.mp3"
        data-start="0"
        data-duration="30.0"
        data-volume="0.38"
      ></audio>

      <!-- ── EFECTOS DE SONIDO SINCRONIZADOS (SFX) ── -->
      <!-- Escena 1: Hook Impact -->
      <audio
        id="sfx-impact"
        class="clip"
        src="assets/audio/impact-bass-1.mp3"
        data-start="0.05"
        data-duration="1.2"
        data-volume="0.6"
      ></audio>
      <audio
        id="sfx-pop-card1"
        class="clip"
        src="assets/audio/pop.mp3"
        data-start="1.4"
        data-duration="0.3"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-pop-card2"
        class="clip"
        src="assets/audio/pop.mp3"
        data-start="2.3"
        data-duration="0.3"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-pop-card3"
        class="clip"
        src="assets/audio/pop.mp3"
        data-start="3.2"
        data-duration="0.3"
        data-volume="0.5"
      ></audio>

      <!-- Transición 1 -> 2: Whoosh a Página Web -->
      <audio
        id="sfx-whoosh-1"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="5.25"
        data-duration="0.4"
        data-volume="0.5"
      ></audio>
      <!-- SFX de construcción web y click del cursor -->
      <audio
        id="sfx-typing-url"
        class="clip"
        src="assets/audio/typing.mp3"
        data-start="6.1"
        data-duration="0.7"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-cursor-click"
        class="clip"
        src="assets/audio/click.mp3"
        data-start="8.8"
        data-duration="0.3"
        data-volume="0.7"
      ></audio>
      <audio
        id="sfx-toast-web"
        class="clip"
        src="assets/audio/notification.mp3"
        data-start="9.1"
        data-duration="0.6"
        data-volume="0.6"
      ></audio>

      <!-- Transición 2 -> 3: Whoosh a Aplicación Web -->
      <audio
        id="sfx-whoosh-2"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="11.75"
        data-duration="0.4"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-data-sync"
        class="clip"
        src="assets/audio/ping.mp3"
        data-start="13.2"
        data-duration="0.8"
        data-volume="0.55"
      ></audio>
      <audio
        id="sfx-app-click"
        class="clip"
        src="assets/audio/click.mp3"
        data-start="15.0"
        data-duration="0.3"
        data-volume="0.65"
      ></audio>

      <!-- Transición 3 -> 4: Whoosh a Plataforma SaaS -->
      <audio
        id="sfx-whoosh-3"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="18.25"
        data-duration="0.4"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-saas-login"
        class="clip"
        src="assets/audio/pop.mp3"
        data-start="19.4"
        data-duration="0.4"
        data-volume="0.55"
      ></audio>
      <audio
        id="sfx-payment-received"
        class="clip"
        src="assets/audio/notification.mp3"
        data-start="21.6"
        data-duration="0.7"
        data-volume="0.65"
      ></audio>

      <!-- Transición 4 -> 5: Whoosh a PlayComun CTA -->
      <audio
        id="sfx-whoosh-4"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="24.25"
        data-duration="0.4"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-brand-chime"
        class="clip"
        src="assets/audio/chime.mp3"
        data-start="24.5"
        data-duration="1.8"
        data-volume="0.7"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });

      (function () {
        var tl = window.__timelines["main"];

        // Transición Escena 1 -> 2
        tl.to("#el-01-hook", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 5.3);
        tl.fromTo("#el-02-web", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 5.3);

        // Transición Escena 2 -> 3
        tl.to("#el-02-web", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 11.8);
        tl.fromTo("#el-03-webapp", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 11.8);

        // Transición Escena 3 -> 4
        tl.to("#el-03-webapp", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 18.3);
        tl.fromTo("#el-04-saas", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 18.3);

        // Transición Escena 4 -> 5
        tl.to("#el-04-saas", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 24.3);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 24.3);

        // Anclaje total 30.0 segundos
        tl.to({}, { duration: 30.0 }, 0);
      })();
    </script>
  </body>
</html>
