<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>FitAdmi — Reel de Lanzamiento</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0A0A0A;
      overflow: hidden;
    }
    .stage-root {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0A0A0A;
      color: #FAFAFA;
      overflow: hidden;
    }
    .clip-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div
    data-composition-id="fitadmi-presentacion"
    data-width="1080"
    data-height="1920"
    data-fps="30"
    data-duration="45"
    class="stage-root"
  >
    <!-- Escena 1: 00:00 - 00:05.4 -->
    <div
      id="slot-01"
      class="clip clip-slot"
      data-composition-id="scene-01-presentacion"
      data-start="0"
      data-duration="5.4"
      data-track-index="0"
      data-composition-src="compositions/frames/01-presentacion.html"
    ></div>

    <!-- Escena 2: 00:05 - 00:12.4 -->
    <div
      id="slot-02"
      class="clip clip-slot"
      data-composition-id="scene-02-clientes"
      data-start="5"
      data-duration="7.4"
      data-track-index="1"
      data-composition-src="compositions/frames/02-clientes.html"
    ></div>

    <!-- Escena 3: 00:12 - 00:19.4 -->
    <div
      id="slot-03"
      class="clip clip-slot"
      data-composition-id="scene-03-excel"
      data-start="12"
      data-duration="7.4"
      data-track-index="0"
      data-composition-src="compositions/frames/03-excel.html"
    ></div>

    <!-- Escena 4: 00:19 - 00:29.4 -->
    <div
      id="slot-04"
      class="clip clip-slot"
      data-composition-id="scene-04-gestion"
      data-start="19"
      data-duration="10.4"
      data-track-index="1"
      data-composition-src="compositions/frames/04-gestion.html"
    ></div>

    <!-- Escena 5: 00:29 - 00:38.4 -->
    <div
      id="slot-05"
      class="clip clip-slot"
      data-composition-id="scene-05-app-socios"
      data-start="29"
      data-duration="9.4"
      data-track-index="0"
      data-composition-src="compositions/frames/05-app-socios.html"
    ></div>

    <!-- Escena 6: 00:38 - 00:45 -->
    <div
      id="slot-06"
      class="clip clip-slot"
      data-composition-id="scene-06-cierre"
      data-start="38"
      data-duration="7"
      data-track-index="1"
      data-composition-src="compositions/frames/06-cierre.html"
    ></div>

    <!-- Pista de música instrumental (Track 2, con headroom para la voz en off) -->
    <audio
      id="bgm-main"
      src="assets/audio/bgm-beat.mp3"
      data-start="0"
      data-duration="45"
      data-track-index="2"
      data-volume="0.18"
      data-fade-in="1.2"
      data-fade-out="2.5"
    ></audio>

    <!-- Pista de efectos de sonido discretos (Track 3) -->
    <audio id="sfx-impact-1" src="assets/audio/impact-bass-1.mp3" data-start="0.15" data-duration="2" data-track-index="3" data-volume="0.28"></audio>
    <audio id="sfx-whoosh-1" src="assets/audio/whoosh-cinematic.mp3" data-start="4.9" data-duration="1.5" data-track-index="3" data-volume="0.24"></audio>
    <audio id="sfx-click-1" src="assets/audio/click-soft.mp3" data-start="7.8" data-duration="0.37" data-track-index="3" data-volume="0.28"></audio>
    <audio id="sfx-whoosh-2" src="assets/audio/whoosh.mp3" data-start="11.9" data-duration="0.57" data-track-index="3" data-volume="0.22"></audio>
    <audio id="sfx-chime-1" src="assets/audio/chime.mp3" data-start="16.2" data-duration="1.5" data-track-index="3" data-volume="0.26"></audio>
    <audio id="sfx-whoosh-3" src="assets/audio/whoosh-short.mp3" data-start="18.9" data-duration="0.57" data-track-index="3" data-volume="0.22"></audio>
    <audio id="sfx-pop-1" src="assets/audio/pop.mp3" data-start="21.5" data-duration="0.6" data-track-index="3" data-volume="0.22"></audio>
    <audio id="sfx-pop-2" src="assets/audio/pop.mp3" data-start="24.0" data-duration="0.6" data-track-index="3" data-volume="0.22"></audio>
    <audio id="sfx-pop-3" src="assets/audio/pop.mp3" data-start="26.5" data-duration="0.6" data-track-index="3" data-volume="0.22"></audio>
    <audio id="sfx-whoosh-4" src="assets/audio/whoosh-cinematic.mp3" data-start="28.9" data-duration="1.5" data-track-index="3" data-volume="0.24"></audio>
    <audio id="sfx-notif-1" src="assets/audio/notification.mp3" data-start="32.4" data-duration="1.0" data-track-index="3" data-volume="0.24"></audio>
    <audio id="sfx-impact-2" src="assets/audio/impact-bass-2.mp3" data-start="38.1" data-duration="2.0" data-track-index="3" data-volume="0.28"></audio>
    <audio id="sfx-sparkle-1" src="assets/audio/sparkle.mp3" data-start="40.6" data-duration="1.8" data-track-index="3" data-volume="0.24"></audio>

    <!-- Pista de locución / voz en off (Track 4) -->
    <audio
      id="vo-main"
      src="assets/audio/vo-fitadmi.mp3"
      data-start="0.35"
      data-duration="43.08"
      data-track-index="4"
      data-volume="1.0"
    ></audio>
  </div>

  <script>
    const masterTl = gsap.timeline({ paused: true });
    masterTl.fromTo("#slot-02", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 5);
    masterTl.fromTo("#slot-03", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 12);
    masterTl.fromTo("#slot-04", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 19);
    masterTl.fromTo("#slot-05", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 29);
    masterTl.fromTo("#slot-06", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 38);
    masterTl.to({}, { duration: 45 }, 0);
    window.__timelines["fitadmi-presentacion"] = masterTl;
  </script>
</body>
</html>
