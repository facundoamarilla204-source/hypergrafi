<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #161616;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-coex"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div data-hf-id="hf-shdv"
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.6"
        data-track-index="0"
      ></div>

      <div data-hf-id="hf-64sd"
        id="el-02-solution"
        class="scene"
        data-composition-id="02-solution"
        data-composition-src="compositions/frames/02-solution.html"
        data-start="5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div data-hf-id="hf-9poi"
        id="el-03-features"
        class="scene"
        data-composition-id="03-features"
        data-composition-src="compositions/frames/03-features.html"
        data-start="10"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div data-hf-id="hf-zokk"
        id="el-04-experience"
        class="scene"
        data-composition-id="04-experience"
        data-composition-src="compositions/frames/04-experience.html"
        data-start="18"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div data-hf-id="hf-dd93"
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="24"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-solution", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 5);
        tl.to("#el-02-solution", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-features", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 10);
        tl.to("#el-03-features", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-experience", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 18);
        tl.to("#el-04-experience", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 24);
        tl.to({}, { duration: 30 }, 0);
      })();
    </script>
  </body>
</html>
